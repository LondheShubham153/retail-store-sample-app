name: CI - Build, Push & Update Helm Charts

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build all services'
        required: false
        default: 'true'
  push:
    branches:
      - main
    paths:
      - 'src/cart/**'
      - 'src/catalog/**'
      - 'src/checkout/**'
      - 'src/orders/**'
      - 'src/ui/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/cart/**'
      - 'src/catalog/**'
      - 'src/checkout/**'
      - 'src/orders/**'
      - 'src/ui/**'

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 032398582096.dkr.ecr.us-west-2.amazonaws.com

permissions:
  contents: write

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      cart:     ${{ steps.filter.outputs.cart }}
      catalog:  ${{ steps.filter.outputs.catalog }}
      checkout: ${{ steps.filter.outputs.checkout }}
      orders:   ${{ steps.filter.outputs.orders }}
      ui:       ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cart:
              - 'src/cart/**'
            catalog:
              - 'src/catalog/**'
            checkout:
              - 'src/checkout/**'
            orders:
              - 'src/orders/**'
            ui:
              - 'src/ui/**'

  build-push-update:
    name: Build & Push - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.cart == 'true' ||
      needs.detect-changes.outputs.catalog == 'true' ||
      needs.detect-changes.outputs.checkout == 'true' ||
      needs.detect-changes.outputs.orders == 'true' ||
      needs.detect-changes.outputs.ui == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: cart
          - service: catalog
          - service: checkout
          - service: orders
          - service: ui

    steps:
      - name: Check if service should build
        id: should_build
        run: |
          EVENT="${{ github.event_name }}"
          SERVICE="${{ matrix.service }}"
          if [ "$EVENT" == "workflow_dispatch" ]; then
            echo "BUILD=true" >> $GITHUB_OUTPUT
          elif [ "$SERVICE" == "cart" ] && [ "${{ needs.detect-changes.outputs.cart }}" == "true" ]; then
            echo "BUILD=true" >> $GITHUB_OUTPUT
          elif [ "$SERVICE" == "catalog" ] && [ "${{ needs.detect-changes.outputs.catalog }}" == "true" ]; then
            echo "BUILD=true" >> $GITHUB_OUTPUT
          elif [ "$SERVICE" == "checkout" ] && [ "${{ needs.detect-changes.outputs.checkout }}" == "true" ]; then
            echo "BUILD=true" >> $GITHUB_OUTPUT
          elif [ "$SERVICE" == "orders" ] && [ "${{ needs.detect-changes.outputs.orders }}" == "true" ]; then
            echo "BUILD=true" >> $GITHUB_OUTPUT
          elif [ "$SERVICE" == "ui" ] && [ "${{ needs.detect-changes.outputs.ui }}" == "true" ]; then
            echo "BUILD=true" >> $GITHUB_OUTPUT
          else
            echo "BUILD=false" >> $GITHUB_OUTPUT
            echo "Skipping $SERVICE - no changes detected"
          fi

      - name: Checkout code
        if: steps.should_build.outputs.BUILD == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials
        if: steps.should_build.outputs.BUILD == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.should_build.outputs.BUILD == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        if: steps.should_build.outputs.BUILD == 'true'
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "IMAGE_TAG=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        if: steps.should_build.outputs.BUILD == 'true'
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/demo-private/${{ matrix.service }}:${{ steps.tag.outputs.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/demo-private/${{ matrix.service }}:latest \
            ./src/${{ matrix.service }}

      - name: Push Docker image to ECR
        if: steps.should_build.outputs.BUILD == 'true'
        run: |
          docker push ${{ env.ECR_REGISTRY }}/demo-private/${{ matrix.service }}:${{ steps.tag.outputs.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/demo-private/${{ matrix.service }}:latest

      - name: Update Helm chart image tag
        if: steps.should_build.outputs.BUILD == 'true' && github.ref == 'refs/heads/main'
        run: |
          VALUES_FILE="src/${{ matrix.service }}/chart/values.yaml"
          awk '
            /^image:/ { in_image=1 }
            in_image && /^\s+repository:/ && !repo_done {
              sub(/repository:.*/, "repository: \"${{ env.ECR_REGISTRY }}/demo-private/${{ matrix.service }}\"")
              repo_done=1
            }
            in_image && /^\s+tag:/ && !tag_done {
              sub(/tag:.*/, "tag: \"${{ steps.tag.outputs.IMAGE_TAG }}\"")
              tag_done=1
            }
            /^[a-zA-Z]/ && !/^image:/ { in_image=0 }
            { print }
          ' "$VALUES_FILE" > "$VALUES_FILE.tmp" && mv "$VALUES_FILE.tmp" "$VALUES_FILE"

      - name: Commit and push Helm chart update
        if: steps.should_build.outputs.BUILD == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}
          git add src/${{ matrix.service }}/chart/values.yaml
          git diff --cached --quiet || \
            git commit -m "ci(${{ matrix.service }}): update image tag to ${{ steps.tag.outputs.IMAGE_TAG }} [skip ci]"
          for i in 1 2 3 4 5; do
            git pull origin main --rebase && git push && break
            echo "Push attempt $i failed, retrying in 5 seconds..."
            sleep 5
          done
