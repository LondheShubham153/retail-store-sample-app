name: Test & Quality Gates

on:
  pull_request:
    branches: [gitops]
    paths: ['src/**']
  push:
    branches: [gitops]
    paths: ['src/**']

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      changed-services: ${{ steps.changes.outputs.changed-services }}
      matrix: ${{ steps.changes.outputs.matrix }}
      has-changes: ${{ steps.changes.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          SERVICES=("ui" "catalog" "cart" "checkout" "orders")
          CHANGED_SERVICES=()
          
          echo "🔍 Checking for changes in services..."
          
          for service in "${SERVICES[@]}"; do
            if git diff --name-only HEAD~1 HEAD | grep -q "^src/$service/" || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              CHANGED_SERVICES+=("$service")
              echo "✅ Changes detected in: $service"
            else
              echo "⏭️ No changes in: $service"
            fi
          done
          
          if [ ${#CHANGED_SERVICES[@]} -eq 0 ]; then
            echo "❌ No services changed"
            echo "has-changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          MATRIX_JSON="["
          for i in "${!CHANGED_SERVICES[@]}"; do
            if [ $i -gt 0 ]; then
              MATRIX_JSON+=","
            fi
            MATRIX_JSON+="\"${CHANGED_SERVICES[$i]}\""
          done
          MATRIX_JSON+="]"
          
          echo "changed-services=${CHANGED_SERVICES[*]}" >> $GITHUB_OUTPUT
          echo "matrix={\"service\":$MATRIX_JSON}" >> $GITHUB_OUTPUT
          echo "has-changes=true" >> $GITHUB_OUTPUT

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java for Java services
        if: matrix.service == 'ui' || matrix.service == 'cart' || matrix.service == 'orders'
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup Go for Catalog service
        if: matrix.service == 'catalog'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node.js for Checkout service
        if: matrix.service == 'checkout'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run tests for ${{ matrix.service }}
        run: |
          SERVICE="${{ matrix.service }}"
          cd "src/${SERVICE}"
          
          case "${SERVICE}" in
            "ui"|"cart"|"orders")
              echo "🧪 Running Java tests for ${SERVICE}"
              ./mvnw test
              ;;
            "catalog")
              echo "🧪 Running Go tests for ${SERVICE}"
              go test ./...
              ;;
            "checkout")
              echo "🧪 Running Node.js tests for ${SERVICE}"
              npm ci
              npm test
              ;;
          esac

  security-scan:
    name: Security Scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'src/${{ matrix.service }}'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'

  build-test:
    name: Build Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, test]
    if: needs.detect-changes.outputs.has-changes == 'true'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Test Docker build for ${{ matrix.service }}
        run: |
          SERVICE="${{ matrix.service }}"
          echo "🔨 Testing Docker build for ${SERVICE}"
          docker build -t "test-${SERVICE}:latest" "src/${SERVICE}/"
          echo "✅ Docker build successful for ${SERVICE}"

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test, security-scan, build-test]
    if: always()
    steps:
      - name: Check quality gate
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || 
             [ "${{ needs.security-scan.result }}" != "success" ] || 
             [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "❌ Quality gate failed"
            exit 1
          else
            echo "✅ Quality gate passed"
          fi