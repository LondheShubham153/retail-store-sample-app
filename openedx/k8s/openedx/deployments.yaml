apiVersion: apps/v1
kind: Deployment
metadata:
  name: openedx-lms
  namespace: openedx
  labels:
    app.kubernetes.io/name: openedx-lms
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openedx-lms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openedx-lms
    spec:
      containers:
        - name: lms
          image: overhangio/openedx:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: openedx-external-databases
          env:
            - name: SERVICE_VARIANT
              value: "lms"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: media
              mountPath: /openedx/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: openedx-media
---
