apiVersion: apps/v1
kind: Deployment
metadata:
  name: openedx-workers
  namespace: openedx
  labels:
    app.kubernetes.io/name: openedx-workers
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openedx-workers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openedx-workers
    spec:
      containers:
        - name: workers
          image: overhangio/openedx:latest
          envFrom:
            - secretRef:
                name: openedx-external-databases
          env:
            - name: SERVICE_VARIANT
              value: "worker"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
