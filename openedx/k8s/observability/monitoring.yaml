apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openedx-lms
  namespace: openedx-observability
  labels:
    release: kube-prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openedx-lms
  namespaceSelector:
    matchNames:
      - openedx
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openedx-cms
  namespace: openedx-observability
  labels:
    release: kube-prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openedx-cms
  namespaceSelector:
    matchNames:
      - openedx
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
